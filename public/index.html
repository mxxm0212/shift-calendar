<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排班日历</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- 左侧面板：日历导航 + 计划列表 -->
    <aside class="left-panel" id="leftPanel">
      <!-- 月份导航 -->
      <div class="cal-nav">
        <button class="btn-icon" id="prevMonth">◀</button>
        <span class="cal-nav-title" id="monthYear">2026年7月</span>
        <button class="btn-icon" id="nextMonth">▶</button>
      </div>

      <!-- 紧凑日历 -->
      <div class="mini-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="mini-calendar" id="miniCalendar">
        <!-- JS 渲染 -->
      </div>

      <!-- 图例 -->
      <div class="mini-legend" id="legendBox">
        <span class="legend-dot start"></span>进班
        <span class="legend-dot day"></span>白班
        <span class="legend-dot end"></span>出班
        <span class="legend-dot rest"></span>休息
        <span class="legend-dot holiday"></span>节假日
      </div>

      <!-- 按钮行 -->
      <div class="left-actions">
        <button class="btn btn-small" id="btnToday">今天</button>
        <button class="btn btn-small btn-setting" id="btnSettings">⚙️ 设置</button>
      </div>

      <!-- 分隔线 -->
      <div class="section-divider" id="widgetZoneDivider"></div>

      <!-- 万年历 -->
      <div class="year-calendar" id="yearCalendar">
        <!-- JS 动态渲染全年 12 个月 -->
      </div>

      <!-- 老黄历 -->
      <div class="lunar-card" id="lunarCard">
        <div class="lunar-header">📅 老黄历</div>
        <div class="lunar-body" id="lunarBody">
          <p class="lunar-date">—</p>
          <p class="lunar-stem">—</p>
        </div>
      </div>
    </aside>

    <!-- 右侧详情面板 -->
    <main class="right-panel" id="rightPanel">
      <!-- 日期标题 -->
      <div class="detail-header">
        <div class="detail-date-title">
          <h2 id="detailDate">7月7日 周一</h2>
          <span class="shift-badge shift-unknown" id="detailShiftBadge">白班</span>
        </div>
        <div class="detail-shift-actions">
          <select id="detailShiftSelect" class="shift-select">
            <option value="">自动推算</option>
            <option value="start">🚪 进班</option>
            <option value="day">🌞 白班</option>
            <option value="end">🏁 出班</option>
            <option value="night">🌙 夜班</option>
            <option value="trip">✈️ 出差</option>
            <option value="holiday_overtime">🔥 节假日加班</option>
            <option value="rest">🏠 休息</option>
            <option value="holiday">🎉 节假日</option>
          </select>
          <button class="btn-icon" id="btnEditLayout" title="自定义布局">✏️</button>
        </div>
      </div>

      <!-- 卡片容器（双栏 Grid） -->
      <div class="cards-grid">

        <!-- 今日概览 -->
        <div class="card" id="overviewCard">
          <div class="card-header">
            <h3>📊 今日概览</h3>
          </div>
          <div class="card-body">
            <div class="overview-grid" id="overviewGrid">
              <!-- JS 动态渲染 -->
            </div>
          </div>
        </div>

        <!-- 班型周期 -->
        <div class="card" id="cycleCard">
          <div class="card-header">
            <h3>🔄 班型周期</h3>
          </div>
          <div class="card-body">
            <div class="cycle-bar" id="cycleBar">
              <!-- JS 动态渲染：14 格进度条 -->
            </div>
            <p class="cycle-label" id="cycleLabel"></p>
          </div>
        </div>

        <!-- 工作日志（全宽） -->
        <div class="card card-full" id="worklogCard">
          <div class="card-header">
            <h3>📝 工作日志</h3>
          </div>
          <div class="card-body">
            <div class="worklog-rows" id="worklogRows">
              <!-- JS 动态渲染 -->
            </div>
            <div class="worklog-actions">
              <small id="worklogUpdated"></small>
              <div style="display:flex;gap:8px;">
                <button class="btn btn-small btn-secondary" id="btnAddWorklogRow">＋ 添加一行</button>
                <button class="btn btn-primary" id="btnSaveWorklog">保存日志</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 当天计划 -->
        <div class="card" id="dayPlansCard">
          <div class="card-header">
            <h3>📋 当天计划</h3>
            <button class="btn btn-small btn-secondary" id="btnAddPlan">＋ 新建</button>
          </div>
          <div class="card-body">
            <div class="day-plan-list" id="dayPlanList">
              <p class="empty-hint">当天没有计划</p>
            </div>
          </div>
        </div>

        <!-- 近期计划 -->
        <div class="card" id="upcomingCard">
          <div class="card-header">
            <h3>🔜 近期计划</h3>
          </div>
          <div class="card-body">
            <div class="upcoming-list" id="upcomingList">
              <!-- JS 动态渲染 -->
            </div>
          </div>
        </div>

        <!-- 全部计划（全宽） -->
        <div class="card card-full" id="allPlansCard">
          <div class="card-header">
            <h3>📋 全部计划</h3>
            <button class="btn btn-small btn-secondary" id="btnAddPlanAll">＋ 新建</button>
          </div>
          <div class="card-body" id="allPlansBody">
            <div class="plan-list" id="planList">
              <p class="empty-hint">暂无计划</p>
            </div>
          </div>
        </div>

      </div><!-- /cards-grid -->
    </main>
  </div>

  <!-- 模块管理抽屉 -->
  <div class="widget-drawer" id="widgetDrawer">
    <div class="widget-drawer-header">
      <h4>📦 模块管理</h4>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-small btn-secondary" id="btnResetLayout">恢复默认</button>
        <button class="btn btn-small btn-primary" id="btnFinishEdit">✓ 完成</button>
      </div>
    </div>
    <div id="widgetDrawerList"></div>
  </div>

  <!-- 遮罩 -->
  <div class="overlay" id="overlay"></div>

  <!-- 设置弹窗 -->
  <div class="modal" id="settingsModal">
    <div class="modal-header">
      <h3>⚙️ 设置</h3>
      <button class="btn-icon modal-close" id="settingsClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="refDate">排班参考起始日（必须是周一）</label>
        <input type="date" id="refDate">
        <small>设定你某个进班的周一，系统会以此为基准推算所有日期的排班状态。</small>
      </div>
      <div class="form-group">
        <label for="webhookUrl">飞书机器人 Webhook URL</label>
        <input type="url" id="webhookUrl" placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/...">
        <small>计划到期时通过飞书机器人推送提醒到你手机。</small>
      </div>
      <button class="btn btn-primary" id="btnSaveSettings">保存设置</button>
    </div>
  </div>

  <!-- 新建/编辑计划弹窗 -->
  <div class="modal" id="planModal">
    <div class="modal-header">
      <h3 id="planModalTitle">新建计划</h3>
      <button class="btn-icon modal-close" id="planModalClose">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="planId">
      <div class="form-group">
        <label for="planTitle">计划标题 *</label>
        <input type="text" id="planTitle" placeholder="例如：提交工作报告">
      </div>
      <div class="form-group">
        <label for="planDesc">备注</label>
        <textarea id="planDesc" rows="2" placeholder="可选"></textarea>
      </div>
      <div class="form-group">
        <label for="planDeadline">截止时间 *</label>
        <input type="datetime-local" id="planDeadline">
      </div>
      <div class="form-group">
        <label for="planReminder">提前提醒</label>
        <select id="planReminder">
          <option value="3">3 分钟</option>
          <option value="5">5 分钟</option>
          <option value="10">10 分钟</option>
          <option value="15">15 分钟</option>
          <option value="20">20 分钟</option>
          <option value="30" selected>30 分钟</option>
          <option value="45">45 分钟</option>
          <option value="60">1 小时</option>
          <option value="120">2 小时</option>
          <option value="180">3 小时</option>
          <option value="360">6 小时</option>
          <option value="720">12 小时</option>
          <option value="1440">1 天</option>
          <option value="2880">2 天</option>
          <option value="4320">3 天</option>
          <option value="10080">1 周</option>
        </select>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="btnSavePlan">保存</button>
        <button class="btn btn-secondary" id="btnCancelPlan">取消</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
